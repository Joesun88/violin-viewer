<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Violin Material Configurator</title>

<script type="module"
  src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
</script>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

model-viewer {
  width: 100vw;
  height: 100vh;
  background: #f5f5f5;
}

.panel {
  position: fixed;
  top: 20px;
  left: 20px;
  background: rgba(255,255,255,0.92);
  padding: 16px;
  border-radius: 14px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.18);
  z-index: 10;
  width: 220px;
}

.panel button {
  display: block;
  width: 100%;
  margin: 6px 0;
  padding: 8px;
  cursor: pointer;
}

.panel label {
  display: block;
  margin-top: 12px;
  font-size: 14px;
}
</style>
</head>
<body>

<div class="panel">

  <strong>Wood Texture</strong>
  <button onclick="setWood('wood-light.jpg')">Light Wood</button>
  <button onclick="setWood('wood-dark.jpg')">Dark Wood</button>
  <button onclick="setWood('wood-red.jpg')">Red Wood</button>

  <strong>Tint</strong>
  <button onclick="setTint(1,1,1)">Normal</button>
  <button onclick="setTint(1,0.92,0.85)">Warm</button>
  <button onclick="setTint(0.8,0.8,0.8)">Gray</button>

  <strong>Finish</strong>
  <button onclick="setFinish(0,0.65)">Matte Wood</button>
  <button onclick="setFinish(0,0.25)">Gloss Lacquer</button>
  <button onclick="setFinish(0.8,0.15)">Metal Look</button>

  <label>
    Brightness:
    <span id="brightnessValue">0.80</span>
  </label>
  <input
    type="range"
    id="brightnessSlider"
    min="0.3"
    max="2.0"
    step="0.05"
    value="0.8"
    style="width:100%;">
</div>

<model-viewer
  id="mv"
  src="Violin-v1.glb"
  poster="poster.webp"

  camera-controls
  auto-rotate
  rotation-per-second="15deg"

  environment-image="https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr"
  tone-mapping="neutral"
  exposure="0.8"

  shadow-intensity="1"
  shadow-softness="0.6"

  camera-orbit="auto auto auto"
  field-of-view="auto">
</model-viewer>

<script type="module">
const mv = document.querySelector("#mv");

window.setWood = async function(textureUrl) {
  const tex = await mv.createTexture(textureUrl);

  mv.model.materials.forEach(mat => {
    if (mat.pbrMetallicRoughness.baseColorTexture) {
      mat.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
    }
  });
};

window.setTint = function(r,g,b) {
  mv.model.materials.forEach(mat => {
    mat.pbrMetallicRoughness.setBaseColorFactor([r,g,b,1]);
  });
};

window.setFinish = function(metallic, roughness) {
  mv.model.materials.forEach(mat => {
    mat.pbrMetallicRoughness.setMetallicFactor(metallic);
    mat.pbrMetallicRoughness.setRoughnessFactor(roughness);
  });
};

const brightnessSlider = document.querySelector("#brightnessSlider");
const brightnessValue = document.querySelector("#brightnessValue");

brightnessSlider.addEventListener("input", () => {
  mv.exposure = brightnessSlider.value;
  brightnessValue.textContent = Number(brightnessSlider.value).toFixed(2);
});
</script>

</body>
</html>
