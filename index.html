<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #f5f5f5;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background: #ffffff;
    }

    #ar-button {
      position: absolute;
      bottom: 16px;
      left: 16px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #000;
      color: #fff;
      cursor: pointer;
    }

    .progress-bar {
      display: block;
      width: 100%;
      height: 4px;
      background: #ddd;
    }

    .update-bar {
      width: 0%;
      height: 100%;
      background: #000;
    }
  </style>
</head>
<body>

<model-viewer
  src="Violin-v1.glb"
  poster="poster.webp"

  ar
  ar-modes="scene-viewer webxr quick-look"

  camera-controls
  auto-rotate

  environment-image="https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr"

  tone-mapping="neutral"
  shadow-intensity="1"

  camera-orbit="19.98deg 41.13deg 13.23m"
  field-of-view="30deg">

  <div class="progress-bar hide" slot="progress-bar">
    <div class="update-bar"></div>
  </div>

  <button slot="ar-button" id="ar-button">
    View in your space
  </button>

  <div id="ar-prompt">
    <img src="https://modelviewer.dev/shared-assets/icons/hand.png">
  </div>

</model-viewer>

<script type="module">
const mv = document.querySelector("model-viewer");

mv.addEventListener("load", () => {
  mv.model.materials.forEach((mat) => {
    const pbr = mat.pbrMetallicRoughness;

    pbr.setMetallicFactor(0.1);
    pbr.setRoughnessFactor(0.25);
  });
});
</script>

</body>
</html>
