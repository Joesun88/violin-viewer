<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
const mv = document.querySelector("model-viewer");

mv.addEventListener("load", () => {
  const material = mv.model.materials[0];

  material.pbrMetallicRoughness.setBaseColorFactor([0.5, 0.5, 0.5, 1]);
});
  </script>

  <style>
    body {
      margin: 0;
      background: #f5f5f5;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background: #ffffff;
    }

    #ar-button {
      position: absolute;
      bottom: 16px;
      left: 16px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #000;
      color: #fff;
      cursor: pointer;
    }

    .progress-bar {
      display: block;
      width: 100%;
      height: 4px;
      background: #ddd;
    }

    .update-bar {
      width: 0%;
      height: 100%;
      background: #000;
    }
  </style>
</head>
<body>


<model-viewer
  src="Violin-v1.glb"
  camera-controls
  environment-image="studio"
  shadow-intensity="1"
  exposure="0.85"
  tone-mapping="neutral">

</model-viewer>

<script type="module">
const mv = document.querySelector("model-viewer");

mv.addEventListener("load", () => {
  mv.model.materials.forEach((mat) => {
    mat.pbrMetallicRoughness.setBaseColorFactor([0.5, 0.5, 0.5, 1]);
  });
});
</script>


</body>
</html>
