<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Violin Viewer</title>

<script type="module"
  src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
</script>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}

model-viewer {
  width: 100vw;
  height: 100vh;
  background: #f5f5f5;
}

.panel {
  position: fixed;
  top: 20px;
  left: 20px;
  background: rgba(255,255,255,0.9);
  padding: 14px;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  z-index: 10;
  width: 220px;
}
</style>
</head>
<body>

<div class="panel">
  <label>Brightness</label><br>
  <input
    type="range"
    id="brightness"
    min="0.3"
    max="2"
    step="0.05"
    value="0.8">
  <span id="brightnessValue">0.8</span>
</div>

<model-viewer
  id="mv"
  src="Violin-v1.glb"
  camera-controls
  auto-rotate
  exposure="0.8"
  environment-image="https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr"
  shadow-intensity="1">
</model-viewer>

<script>
const mv = document.getElementById("mv");
const slider = document.getElementById("brightness");
const value = document.getElementById("brightnessValue");

slider.addEventListener("input", () => {
  mv.exposure = slider.value;
  value.textContent = slider.value;
});
</script>

</body>
</html>
